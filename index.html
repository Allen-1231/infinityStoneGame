:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07060f;--card:#0f0d26;--fg:#ebe8ff;--mut:#8b87b3;--line:#2a2650;--ac:#a98bff;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060f;--card:#0f0d26;--fg:#ebe8ff;--mut:#8b87b3;--line:#2a2650;--ac:#a98bff}}
:root[data-theme="dark"]{--bg:#07060f;--card:#0f0d26;--fg:#ebe8ff;--mut:#8b87b3;--line:#2a2650;--ac:#a98bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 60% 45% at 12% 8%,rgba(162,75,255,.18),transparent),radial-gradient(ellipse 55% 45% at 90% 16%,rgba(47,123,255,.15),transparent),radial-gradient(ellipse 70% 40% at 50% 104%,rgba(255,59,59,.12),transparent),var(--bg);background-attachment:fixed;color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:#0b0a1c;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:700;font-size:18px;color:var(--fg);text-decoration:none;letter-spacing:2px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:999px;font-size:14px}
nav a.on{color:#fff;background:#2a2060}

 {id:'shooter',stone:'現實',c:'#ff3b3b',name:'六關戰役',desc:'六位寶石守衛的射擊戰役，擊敗守衛取得寶石並解鎖專屬武器。',ready:true,mount:mountShooter},

/* ===== 本機成績：存在這台裝置的瀏覽器（localStorage），不需要伺服器 ===== */
const KEY='arcade_scores_v1';
let store={};
try{store=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){store={}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function paintWho(){}
async function submitScore(g,score){
  if(!(score>0))return 'keep';
  const list=store[g]||[],rec={score,t:Date.now()};
  list.push(rec);list.sort((x,y)=>y.score-x.score||x.t-y.t);store[g]=list.slice(0,10);persist();
  return store[g].includes(rec)?'ok':'keep';
}
async function topScores(g){
  return (store[g]||[]).map(r=>({score:r.score,name:new Date(r.t).toLocaleString('zh-TW',{hour12:false}),me:false}));
}
function clearScores(){if(confirm('確定要清除這台裝置上的所有成績嗎？')){store={};persist();route()}}
function initServices(){}

  a.append(h('h1',{},'排行榜'),h('p',{class:'mut'},'成績只存在這台裝置的瀏覽器裡，換裝置或清除瀏覽資料就會消失。'),h('div',{class:'tabs'},GAMES.filter(g=>g.ready).map(g=>lk('board/'+g.id,{class:'btn',style:g.id===gid?'':'background:transparent'},g.name))));

  const g=GAMES.find(x=>x.id===gid);

/* ===== 遊戲 1：寶石反應 ===== */
function mountTap(stage,done){
  const COL=['#a24bff','#2f7bff','#ff3b3b','#ff9a1f','#2fe07a','#ffd52e'];
  const hud=h('div',{class:'hud'}),box=h('div',{id:'box'}),start=h('button',{class:'btn'},'開始（20 秒）');
  const tS=h('span',{},'時間 20'),sS=h('span',{},'分數 0'),cS=h('span',{},'連擊 ×1');hud.append(tS,sS,cS);
  box.append(h('div',{style:'position:absolute;inset:0;display:flex;align-items:center;justify-content:center'},start));stage.append(hud,box);
  let score=0,combo=1,left=20,run=false,timer,spawn;
  function gem(){
    if(!run)return;
    const c=COL[Math.floor(Math.random()*6)],g=h('button',{class:'gem',style:`left:${Math.random()*(box.clientWidth-75)}px;top:${Math.random()*(box.clientHeight-75)}px;background:linear-gradient(135deg,#fff8,${c} 40%,#0006);filter:drop-shadow(0 0 8px ${c})`});
    let hit=false;
    g.onpointerdown=()=>{if(!run||hit)return;hit=true;score+=10*combo;combo=Math.min(5,combo+1);upd();g.remove()};
    box.append(g);g.offsetWidth;g.style.transform='scale(.6)';g.style.opacity='.5';
    setTimeout(()=>{if(!hit&&g.isConnected){combo=1;upd();g.remove()}},1300);
    spawn=setTimeout(gem,Math.max(320,700-(20-left)*18));
  }
  function upd(){sS.textContent='分數 '+score;cS.textContent='連擊 ×'+combo}
  start.onclick=()=>{score=0;combo=1;left=20;run=true;start.parentNode.remove();upd();gem();
    timer=setInterval(()=>{left--;tS.textContent='時間 '+left;if(left<=0){run=false;clearInterval(timer);clearTimeout(spawn);box.textContent='';box.append(h('div',{style:'position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px'},'時間到！得分 '+score));done(score)}},1000)};
  window.__stop=()=>{run=false;clearInterval(timer);clearTimeout(spawn)};
}


/* ===== 3D 水晶寶石：歪斜的菱形三十面體，自轉、折射、反光 ===== */
function shade(h,f){f=Math.max(-.92,Math.min(.92,f));const n=parseInt(h.slice(1),16),r=n>>16,g=n>>8&255,b=n&255,t=f<0?0:255,k=Math.abs(f),m=v=>Math.round(v+(t-v)*k);return`rgb(${m(r)},${m(g)},${m(b)})`}
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* 菱形三十面體：12 個五向頂點（正二十面體頂點）+ 20 個三向頂點（二十面體面中心），30 個菱形面 */
const TOPO=(()=>{
  const p=(1+Math.sqrt(5))/2,nm=v=>{const l=Math.hypot(v[0],v[1],v[2]);return[v[0]/l,v[1]/l,v[2]/l]};
  const I=[];for(const a of[-1,1])for(const b of[-1,1])I.push(nm([0,a,b*p]),nm([a,b*p,0]),nm([b*p,0,a]));
  const d=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1],a[2]-b[2]);
  let md=9;for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)md=Math.min(md,d(I[i],I[j]));
  const adj=(i,j)=>Math.abs(d(I[i],I[j])-md)<1e-6;
  const F=[];for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)if(adj(i,j))for(let k=j+1;k<12;k++)if(adj(i,k)&&adj(j,k))F.push([i,j,k]);
  const D=F.map(f=>nm([0,1,2].map(c=>I[f[0]][c]+I[f[1]][c]+I[f[2]][c])));
  const Q=[];
  for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)if(adj(i,j)){
    const fs=[];F.forEach((f,k)=>{if(f.includes(i)&&f.includes(j))fs.push(k)});
    Q.push([i,12+fs[0],j,12+fs[1]]);
  }
  const e=Q[0],M=nm([0,1,2].map(c=>I[e[0]][c]+I[e[2]][c])),dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
  const r2=dot(I[e[0]],M)/dot(D[e[1]-12],M);
  return{V:I.concat(D.map(v=>v.map(x=>x*r2))),Q};
})();
/* 每顆寶石用不同種子把頂點推歪、再做不等比縮放與剪切，所以每顆都是歪歪的三十面體 */
function makeGem(seed){
  const r=rng(seed*7919+13),sc=[.86+r()*.3,.92+r()*.26,.86+r()*.3],sh=[(r()-.5)*.4,(r()-.5)*.3];
  let V=TOPO.V.map(v=>{
    const q=v.map(x=>x+(r()-.5)*.17),k=.92+r()*.16;
    let x=q[0]*k,y=q[1]*k,z=q[2]*k;x+=sh[0]*y;z+=sh[1]*y;
    return[x*sc[0],y*sc[1],z*sc[2]];
  });
  const mx=Math.max(...V.map(v=>Math.hypot(v[0],v[1],v[2])));V=V.map(v=>v.map(x=>x*1.15/mx));
  const faces=TOPO.Q.map((q,i)=>{
    let n=[0,0,0],c=[0,0,0];
    for(let k=0;k<4;k++){const a=V[q[k]],b=V[q[(k+1)%4]];n[0]+=(a[1]-b[1])*(a[2]+b[2]);n[1]+=(a[2]-b[2])*(a[0]+b[0]);n[2]+=(a[0]-b[0])*(a[1]+b[1]);c=c.map((x,j)=>x+a[j]/4)}
    const l=Math.hypot(n[0],n[1],n[2])||1;n=n.map(x=>x/l);
    if(n[0]*c[0]+n[1]*c[1]+n[2]*c[2]<0)n=n.map(x=>-x);
    return{q,n,v:((i*37)%11)/11-.5};
  });
  return{V,faces};
}
function renderGem(c,W,H,gem,col,t,an,seed){
  c.clearRect(0,0,W,H);
  const s=Math.min(W,H)*.3,cx=W/2,cy=H/2+Math.sin(t*1.6+seed)*H*.014;
  const tl=.45+.12*Math.sin(t*.6+seed),ca=Math.cos(an),sa=Math.sin(an),ct=Math.cos(tl),st=Math.sin(tl);
  const R=p=>{const x=p[0]*ca+p[2]*sa,z=-p[0]*sa+p[2]*ca;return[x,p[1]*ct-z*st,p[1]*st+z*ct]};
  const P=p=>{const f=4/(4-p[2]);return[cx+p[0]*s*f,cy-p[1]*s*f]};
  const RV=gem.V.map(R),PV=RV.map(P);
  const L=[-.45,.75,.5],ll=Math.hypot(L[0],L[1],L[2]),Hf=[L[0]/ll,L[1]/ll,L[2]/ll+1],hl=Math.hypot(Hf[0],Hf[1],Hf[2]);
  const fs=gem.faces.map(f=>({q:f.q,v:f.v,n:R(f.n),z:f.q.reduce((a,i)=>a+RV[i][2],0)/4})).sort((a,b)=>a.z-b.z);
  c.lineJoin='round';
  const pass=front=>fs.forEach(f=>{
    if((f.n[2]>0)!==front)return;
    const lam=Math.max(0,(f.n[0]*L[0]+f.n[1]*L[1]+f.n[2]*L[2])/ll);
    const sp=Math.pow(Math.max(0,(f.n[0]*Hf[0]+f.n[1]*Hf[1]+f.n[2]*Hf[2])/hl),24);
    const fr=Math.pow(1-Math.abs(f.n[2]),2),q=f.q.map(i=>PV[i]);
    c.beginPath();q.forEach((o,i)=>i?c.lineTo(o[0],o[1]):c.moveTo(o[0],o[1]));c.closePath();
    if(!front){c.globalAlpha=.42;c.fillStyle=shade(col,-.35+lam*.3);c.fill();c.globalAlpha=1;c.strokeStyle='rgba(255,255,255,.28)';c.lineWidth=1;c.stroke();return}
    c.globalAlpha=.8;c.fillStyle=shade(col,lam*.95-.5+fr*.2+f.v*.14);c.fill();c.globalAlpha=1;
    if(sp>.02){c.fillStyle='rgba(255,255,255,'+Math.min(.9,sp*.9)+')';c.fill()}
    c.strokeStyle='rgba(255,255,255,.5)';c.lineWidth=1.3;c.stroke();
    if(sp>.5){const m=q.reduce((a,o)=>[a[0]+o[0]/4,a[1]+o[1]/4],[0,0]),z=s*.16*sp;c.strokeStyle='#fff';c.lineWidth=1.6;c.beginPath();c.moveTo(m[0]-z,m[1]);c.lineTo(m[0]+z,m[1]);c.moveTo(m[0],m[1]-z);c.lineTo(m[0],m[1]+z);c.stroke()}
  });
  pass(false);pass(true);
}
const GEO={},SPIN=[.55,.82,.66,.92,.6,.76];
function stoneCard(g){

function reset(st){S={st,stage:0,ph:'wave',pt:0,sp:1,p:{x:W/2,y:H-110,vx:0,vy:0,hp:5,inv:0,a:-1.57},wp:'base',fcd:0,got:[],en:[],pb:[],eb:[],pa:[],lines:[],boss:null,drop:null,bn:null,score:0,flash:0,snap:0,shake:0}}

const tg=()=>S.en.concat(S.boss?[S.boss]:[]);

function fire(){
  const t=nearest();if(!t)return;const p=S.p,a=Math.atan2(t.y-p.y,t.x-p.x),w=S.wp;p.a=a;S.fcd=RATE[w];

function eb(x,y,a,s,c){S.eb.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,c})}
function hurt(){const p=S.p;if(p.inv>0)return;p.hp--;p.inv=1.3;S.shake=.3;S.flash=.12;burst(p.x,p.y,'#ff4d6d',20)}
function update(dt){

    }

      if(b.y>70){
        b.rt-=dt;if(b.rt<=0){b.rt=2.2-st*.1;const n=10+st*2,o=Math.random()*6;for(let i=0;i<n;i++)eb(b.x,b.y,o+i*6.283/n,150,G[st].c)}

  }

    b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt;if(b.l<=0||b.x<-20||b.x>W+20||b.y<-20||b.y>H+20)return false;
    for(const t of tg()){if(b.hit.includes(t)||Math.hypot(t.x-b.x,t.y-b.y)>t.r+b.r)continue;

      if(b.sp){tg().forEach(o=>{if(o!==t&&Math.hypot(o.x-b.x,o.y-b.y)<b.sp)dmg(o,b.d*.5)});S.pa.push({x:b.x,y:b.y,vx:0,vy:0,l:.3,m:.3,c:b.c,ring:b.sp});burst(b.x,b.y,b.c,14)}

let last=performance.now(),raf=0,dead=false;

showOv('無限寶石：六關戰役','六顆寶石、六位守衛。每一關先清掉敵人，再擊敗寶石守衛，取得寶石並解鎖專屬武器。<br>移動：WASD／方向鍵／按住拖曳，自動瞄準射擊。躲開彈幕，集滿六顆即可彈指。','開始戰役');

}
