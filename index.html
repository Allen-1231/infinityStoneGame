:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#07060f;--card:#0f0d26;--fg:#ebe8ff;--mut:#8b87b3;--line:#2a2650;--ac:#a98bff;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07060f;--card:#0f0d26;--fg:#ebe8ff;--mut:#8b87b3;--line:#2a2650;--ac:#a98bff}}
:root[data-theme="dark"]{--bg:#07060f;--card:#0f0d26;--fg:#ebe8ff;--mut:#8b87b3;--line:#2a2650;--ac:#a98bff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse 60% 45% at 12% 8%,rgba(162,75,255,.18),transparent),radial-gradient(ellipse 55% 45% at 90% 16%,rgba(47,123,255,.15),transparent),radial-gradient(ellipse 70% 40% at 50% 104%,rgba(255,59,59,.12),transparent),var(--bg);background-attachment:fixed;color:var(--fg);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;min-height:100%}
header{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:12px 18px;border-bottom:1px solid var(--line);background:#0b0a1c;position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.logo{font-weight:700;font-size:18px;color:var(--fg);text-decoration:none;letter-spacing:2px}
nav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end}
nav a{color:var(--mut);text-decoration:none;padding:6px 12px;border-radius:999px;font-size:14px}
nav a.on{color:#fff;background:#2a2060}
main{max-width:960px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:clamp(26px,5vw,42px);margin:8px 0;letter-spacing:3px;background:linear-gradient(90deg,#a24bff,#2f7bff,#ff3b3b,#ff9a1f,#2fe07a,#ffd52e);-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:20px;margin:26px 0 12px}
p.mut{color:var(--mut);line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}
.card h3{margin:0;font-size:17px}
.card p{margin:0;color:var(--mut);font-size:14px;line-height:1.6;flex:1}
.btn{font:inherit;font-size:14px;padding:8px 18px;border-radius:999px;border:1px solid var(--ac);background:#2a2060;color:#fff;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.off{opacity:.45;pointer-events:none}
.tag{font-size:11px;color:#ffd52e;border:1px solid #ffd52e66;border-radius:999px;padding:1px 8px;align-self:flex-start}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
td,th{padding:10px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--line)}
th{color:var(--mut);font-weight:500}
tr.me td{background:#241c52}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.note{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--mut);font-size:13px;line-height:1.6;margin:12px 0}
#box{position:relative;height:340px;background:#0b0a1c;border:1px solid var(--line);border-radius:14px;overflow:hidden;touch-action:manipulation}
.gem{position:absolute;width:68px;height:68px;border:0;padding:0;cursor:pointer;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);transition:transform 1.2s linear,opacity 1.2s linear}
.hud{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px}

.brand{font-family:'Orbitron','Audiowide','Segoe UI',system-ui,sans-serif;font-weight:900;letter-spacing:.08em;background:linear-gradient(100deg,#a24bff,#2f7bff,#ff3b3b,#ff9a1f,#2fe07a,#ffd52e,#a24bff);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 9s linear infinite}
@keyframes shine{to{background-position:200% 0}}
.logo.brand{font-size:20px;white-space:nowrap}
@media (max-width:480px){header{padding:10px 12px;gap:8px}.logo.brand{font-size:15px;letter-spacing:.05em}nav{gap:2px}nav a{padding:6px 9px;font-size:13px}}
@media (prefers-reduced-motion:reduce){.brand{animation:none}}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main.home{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding-block:16px 24px}
.stones{display:grid;grid-template-columns:repeat(3,1fr);gap:22px 8px;width:100%;max-width:900px;margin:0 auto}
@media (max-width:640px){.stones{grid-template-columns:repeat(2,1fr);gap:14px 4px}}
.stone{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stone canvas{width:100%;max-width:340px;height:auto;aspect-ratio:360/312;transition:transform .25s}
.stone:hover canvas,.stone:focus-visible canvas{transform:scale(1.08)}
.stone:focus-visible{outline:2px solid var(--c);outline-offset:4px;border-radius:12px}
.stone b{font-size:16px;color:var(--c);letter-spacing:3px}
.stone span{font-size:13px}
.stone small{font-size:11px;color:var(--mut)}
.hint{color:var(--mut);font-size:12px;text-align:center;margin-top:8px;line-height:1.6}
.tnl-box{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 0 40px rgba(60,120,255,.18)}
.tnl-cv{display:block;width:100%;height:auto;aspect-ratio:900/560;touch-action:none;background:#05040d}
.tnl-ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:20px;background:rgba(5,4,14,.82)}
.tnl-ov h2{margin:0;font-size:clamp(22px,5vw,36px);letter-spacing:4px}
.tnl-ov p{margin:0;max-width:520px;line-height:1.7;color:#cfcaf5;font-size:15px}
.tnl-ov p.big{font-size:26px;color:#fff}
.tnl-gems{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:720px;width:100%;text-align:left}
.tnl-gems div{border:1px solid var(--c);border-radius:10px;padding:7px 10px;background:rgba(10,8,30,.7);display:flex;flex-direction:column;gap:2px}
.tnl-gems b{color:var(--c);font-size:14px}.tnl-gems span{font-size:12px;color:#cfcaf5;line-height:1.5}
@media (max-width:640px){.tnl-gems{grid-template-columns:repeat(2,1fr);gap:5px}.tnl-gems div{padding:4px 7px}.tnl-gems b{font-size:12px}.tnl-gems span{font-size:10.5px;line-height:1.35}.tnl-ov{position:relative;inset:auto;gap:8px;padding:12px 10px 14px;background:rgba(5,4,13,.96)}.tnl-ov p{font-size:12.5px;line-height:1.5}}
.shw .top{display:flex;justify-content:space-between;align-items:center;padding:6px 4px;font-size:15px}
.shw .hp{color:#ff4d6d;letter-spacing:3px;font-size:18px;min-width:80px}
.shw .top span{color:var(--mut)}
.shw .stage{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 0 40px rgba(140,90,255,.18)}
.shw canvas#cv{display:block;width:100%;height:auto;aspect-ratio:1000/625;touch-action:none;background:#07060f}
.shw #ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:rgba(5,4,14,.84);padding:20px;gap:12px}
.shw #ov h1{margin:0;font-size:clamp(22px,5vw,38px)}
.shw #ov p{margin:0;max-width:540px;line-height:1.7;color:#cfcaf5;font-size:15px}
.shw #ov button{font:inherit;font-size:17px;padding:10px 32px;border-radius:999px;border:1px solid #a98bff;background:linear-gradient(180deg,#5a3bd0,#33208f);color:#fff;cursor:pointer}
.shw #ov.hide{display:none}
.shw .bar{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.shw .slot{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;background:#0d0b22;border:1px solid var(--line);border-radius:10px;color:var(--fg);font:inherit;cursor:pointer}
.shw .slot canvas{width:44px;height:44px}
.shw .slot b{font-size:13px}
.shw .slot small{font-size:10px;color:var(--mut);text-align:center}
.shw .slot.on{border-color:var(--c);box-shadow:0 0 14px var(--c)}

.shw .hpw{display:flex;align-items:center;gap:10px;flex:1 1 0;min-width:0}
.shw .hpbar{position:relative;flex:1;max-width:300px;height:16px;background:#14112e;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.shw .hpbar i{position:absolute;left:0;top:0;bottom:0;width:100%}
.shw #hpg{background:rgba(255,255,255,.8);transition:width .7s ease-out .25s}
.shw #hpf{background:linear-gradient(90deg,#2fe07a,#9be84a);transition:width .12s}
.shw .hpw span{font-size:13px;font-variant-numeric:tabular-nums;color:var(--fg)!important;white-space:nowrap}
.shw .tr{display:flex;align-items:center;gap:12px;flex:1 1 0;justify-content:flex-end}
.shw #sg{flex:none;text-align:center}
.shw .mute{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;padding:0;border-radius:999px;border:1px solid var(--line);background:#0d0b22;color:var(--fg);cursor:pointer}
.shw .mute:hover{color:var(--fg)}
/* ===== 筆電版面（螢幕寬度 900px 以上）：每一頁都縮到一個畫面放得下，遊戲畫面依視窗高度自動縮放 ===== */
@media (min-width:900px){
  :root{--hh:61px;--ch:150px}
  header{padding:10px 28px}
  main{max-width:1560px;padding:14px 32px 18px}

  /* 首頁：六顆寶石 3×2，高度隨視窗調整 */
  main.home{min-height:calc(100vh - var(--hh));padding-block:6px 14px}
  .stones{max-width:1500px;gap:8px 20px}
  .stone canvas{width:auto;max-width:100%;height:clamp(140px,calc((100vh - var(--hh) - 110px)/2),620px);object-fit:contain}

  /* 遊戲列表、排行榜 */
  main[data-pg=games] h1,main[data-pg=board] h1{font-size:30px;margin:2px 0 8px}
  .grid{grid-template-columns:repeat(3,1fr);gap:18px}
  main[data-pg=board] p.mut{margin:4px 0 10px}
  main[data-pg=board] .tabs{margin-bottom:10px}
  main[data-pg=board] td,main[data-pg=board] th{padding:6px 14px}

  /* 遊戲頁：標題縮小、說明收起（開始畫面已有說明） */
  main.play{padding:8px 32px 12px}
  main.play h1{font-size:22px;margin:0 0 4px;letter-spacing:2px;text-align:center}
  main.play > p.mut{display:none}
  main.play .note{margin:8px 0 0;padding:6px 12px;text-align:center}
  main.play .hud{margin-bottom:4px;font-size:14px}
  main.play .hint{margin-top:6px}
  .stg{margin-inline:auto;width:100%}

  /* 寶石反應：點擊區高度跟著視窗 */
  main[data-g=tap] .stg{max-width:1280px}
  main[data-g=tap] #box{height:clamp(280px,calc(100vh - var(--hh) - 170px),640px)}

  /* 螺旋隧道：畫面寬度 = 可用高度 × 900/560 */
  main[data-g=tunnel] .stg{width:min(100%,max(560px,calc((100vh - var(--hh) - var(--ch)) * 1.607)))}

  /* 寶石機鬥：武器列移到畫面右側，省下高度 */
  main[data-g=shooter]{--ch:112px}
  main[data-g=shooter] .stg{width:min(100%,max(600px,calc((100vh - var(--hh) - var(--ch)) * 1.6 + 182px)))}
  .shw{display:grid;grid-template-columns:minmax(0,1fr) 170px;grid-template-areas:"top top" "stage bar" "hint hint";gap:6px 12px}
  .shw .top{grid-area:top;padding:2px 4px}
  .shw .stage{grid-area:stage}
  .shw .bar{grid-area:bar;grid-template-columns:1fr;grid-template-rows:repeat(6,1fr);gap:6px;margin-top:0}
  .shw .hint{grid-area:hint}
  .shw .slot{display:grid;grid-template-columns:36px 1fr;column-gap:8px;align-items:center;justify-items:start;padding:4px 8px;text-align:left}
  .shw .slot canvas{grid-row:1/3;width:36px;height:36px}
  .shw .slot small{text-align:left}
}

@media (max-width:640px){.shw #ov{padding:10px 14px}.shw #ov h1{font-size:21px;margin:0 0 6px}.shw #ov p{font-size:12.5px;line-height:1.55;margin:0 0 10px}.shw #ov button{font-size:15px;padding:8px 26px}}
/* 又寬又矮的螢幕（寬高比 2.1 以上）：六顆寶石排成一列，寶石盡量放大 */
@media (min-width:1100px) and (min-aspect-ratio:21/10){
  main.home{max-width:2400px}
  .stones{grid-template-columns:repeat(6,1fr);gap:8px 12px;max-width:2300px}
  .stone{gap:6px}
  .stone canvas{width:100%;height:auto;max-width:min(520px,calc((100vh - var(--hh) - 80px) * 1.1538));aspect-ratio:360/312;object-fit:fill}
}


.ty-box{position:relative;background:#0b0a1c;border:1px solid var(--line);border-radius:14px;padding:22px 18px 18px;min-height:360px;display:flex;flex-direction:column;align-items:center;gap:14px;overflow:hidden}
.ty-bar{width:100%;height:10px;background:#1a1733;border-radius:99px;overflow:hidden}.ty-bar i{display:block;height:100%;width:100%;border-radius:99px;transition:width .1s linear}
.ty-word{font:700 clamp(34px,8vw,72px)/1.1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;margin-top:26px;min-height:1.2em;text-align:center;word-break:break-all;transition:text-shadow .4s}
.ty-word span{color:#5d5a85}.ty-word .ok{color:#2fe07a}.ty-word .now{color:#fff;border-bottom:3px solid #2fe07a}
.ty-next{display:flex;gap:18px;font:600 20px ui-monospace,Menlo,Consolas,monospace;color:#cfc8ff;flex-wrap:wrap;justify-content:center}
.ty-in{width:min(420px,100%);font:600 24px ui-monospace,Menlo,Consolas,monospace;padding:12px 16px;border-radius:12px;border:2px solid #2fe07a;background:#0f0d26;color:#fff;text-align:center;outline:none;margin-top:6px}
.ty-msg{min-height:1.4em;font-weight:700;transition:opacity .3s}
.ty-ov{position:absolute;inset:0;background:rgba(7,6,15,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
.ty-ov[hidden]{display:none}.ty-t{font-size:32px;font-weight:800;color:#2fe07a}.ty-ov p{margin:0;max-width:460px;color:var(--fg)}

.ty-wrap{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#07060f}
.ty-cv{display:block;margin:0 auto;width:min(100%,calc((100vh - 200px)*1.5));min-width:min(100%,520px);height:auto;aspect-ratio:900/600;touch-action:manipulation}
.ty-hid{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;border:0;padding:0}
.ty-leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:6px 14px;text-align:left;max-width:640px;font-size:13px}
.ty-leg div{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}.ty-leg i{width:10px;height:10px;border-radius:50%;display:inline-block}.ty-leg span{color:var(--mut);flex-basis:100%;padding-left:18px}

.mutebtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:30px;padding:0;border-radius:999px;border:1px solid var(--line);background:#0d0b22;color:var(--fg);cursor:pointer;flex:none}

.ar-cv{display:block;margin:0 auto;width:min(100%,calc((100vh - 230px)*1.3333));min-width:min(100%,520px);height:auto;aspect-ratio:800/600;touch-action:none;background:#07060f}
.ar-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;min-height:26px;justify-content:center}
.ar-chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--c);color:var(--c);background:#0d0b22}
.ar-pick{position:absolute;inset:0;background:rgba(7,6,15,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:12px}
.ar-pick[hidden]{display:none}.ar-pt{font-size:24px;font-weight:800;color:#ffe08a}
.ar-cards{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.ar-card{position:relative;width:200px;min-height:150px;padding:14px 12px;border-radius:14px;border:2px solid var(--c);background:#0f0d26;color:var(--fg);cursor:pointer;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center;font:inherit}
.ar-card:hover{background:#17143a;transform:translateY(-3px)}
.ar-card i{position:absolute;left:8px;top:6px;font-style:normal;font-size:12px;color:var(--mut)}.ar-card b{font-size:18px;color:var(--c)}.ar-card em{font-style:normal;font-size:12px;color:var(--mut)}.ar-card span{font-size:14px}
.ty-ov .big{font-size:26px;font-weight:800}

/* 全螢幕／放大模式（原生全螢幕不行時用整頁覆蓋代替） */
main.play{position:relative}
.fsbtn{position:absolute;right:32px;top:8px;z-index:5;padding:5px 14px;font-size:13px}
html.fsl{overflow:hidden}
.stg.fs{position:fixed;inset:0;z-index:1000;width:100vw!important;max-width:none!important;height:100vh;margin:0!important;background:#07060f;padding:8px 14px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.stg.fs .hud{margin-bottom:4px}.stg.fs .hint{margin-top:4px}
.stg.fs .ty-cv{width:min(100%,calc((100vh - 120px)*1.5))!important}
.stg.fs .ar-cv{width:min(100%,calc((100vh - 140px)*1.3333))!important}

 {id:'archer',stone:'力量',c:'#a24bff',name:'寶石弓手',desc:'弓箭傳說式闖關：邊走邊躲、停下自動射擊，升級從三個技能中選一個。共 25 關，每 5 關一位魔王，途中還有中衛兵。',ready:true,mount:mountArcher},
 {id:'tunnel',stone:'空間',c:'#2f7bff',name:'螺旋隧道',desc:'在太空中的螺旋隧道裡高速飛行，換線閃開障礙，撿起六種寶石，每一種都有自己的能力。',ready:true,mount:mountTunnel},
 {id:'shooter',stone:'現實',c:'#ff3b3b',name:'寶石機鬥',desc:'駕駛你的戰機，闖過六位寶石守衛，取得寶石、解鎖專屬武器，最後直面瘋狂泰坦薩諾斯。',ready:true,mount:mountShooter},
 {id:'soul',stone:'靈魂',c:'#ff9a1f',name:'靈魂戰場',desc:'3D 鍵盤加滑鼠戰鬥：WASD 移動、滑鼠瞄準射擊，右鍵靈魂爆發、空白鍵衝刺。無限波次，每 5 波一位守魂魔王，升級時選強化。',ready:true,mount:mountSoulArena},

/* ===== 共用音效引擎（Web Audio 合成，不需要音檔）：音效、背景音樂、靜音鈕 ===== */
const GA=(()=>{
  let ac=null,mg=null,nb=null,mu=false,vol=.7,mus=null;
  try{mu=localStorage.getItem('bi_mute')==='1'}catch(e){}
  const mtof=n=>440*Math.pow(2,(n-69)/12);
  function ctx(){
    if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();const cp=ac.createDynamicsCompressor();mg=ac.createGain();mg.gain.value=mu?0:vol;mg.connect(cp);cp.connect(ac.destination);
      nb=ac.createBuffer(1,ac.sampleRate,ac.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){ac=null}}
    if(ac&&ac.state==='suspended'){try{ac.resume()}catch(e){}}
    return ac;
  }
  function tone(f,d,type,v,sl,t0,bus){
    const c=ctx();if(!c||mu)return;const t=c.currentTime+(t0||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*sl),t+d);
    g.gain.setValueAtTime(v==null?.2:v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(bus||mg);o.start(t);o.stop(t+d+.03);
  }
  function noise(d,v,fr,t0,hp){
    const c=ctx();if(!c||mu)return;const t=c.currentTime+(t0||0),s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=nb;s.loop=true;f.type=hp?'highpass':'lowpass';f.frequency.setValueAtTime(fr||2000,t);if(!hp)f.frequency.exponentialRampToValueAtTime(Math.max(80,(fr||2000)*.2),t+d);
    g.gain.setValueAtTime(v==null?.2:v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t);s.stop(t+d+.03);
  }
  const last={};
  const gate=(k,ms)=>{const n=Date.now();if(last[k]&&n-last[k]<ms)return false;last[k]=n;return true};
  function setMute(m){mu=m;try{localStorage.setItem('bi_mute',m?'1':'0')}catch(e){}if(mg)mg.gain.value=m?0:vol;if(m)stopMusic()}
  /* —— 背景音樂：簡單的步進編曲器（低音＋琶音＋鼓） —— */
  const TRACKS={
    typing:{bpm:92,root:57,bass:[0,0,7,0,5,5,3,3],lead:[12,0,15,0,19,0,15,0,12,0,15,0,22,0,19,0],lt:'triangle',lv:.06,kick:1,hat:0},
    gold:{bpm:158,root:57,bass:[0,0,0,0,5,5,7,7],lead:[12,12,15,12,19,15,19,22,24,22,19,15,19,15,12,15],lt:'sawtooth',lv:.055,kick:1,hat:1},
    tunnel:{bpm:122,root:55,bass:[0,0,-2,-2,-4,-4,-5,-5],lead:[12,0,15,19,0,15,22,0,12,0,15,19,0,17,15,0],lt:'triangle',lv:.07,kick:1,hat:1},
    boss:{bpm:150,root:50,bass:[0,0,0,3,0,0,5,6],lead:[12,12,15,12,17,15,12,10,12,12,15,12,19,17,15,13],lt:'sawtooth',lv:.04,kick:1,hat:1},
    soul:{bpm:132,root:52,bass:[0,0,3,3,-2,-2,5,3],lead:[12,0,12,15,0,19,15,0,12,0,17,15,0,12,10,0],lt:'sawtooth',lv:.045,kick:1,hat:1},
    archer:{bpm:112,root:52,bass:[0,0,5,5,3,3,7,7],lead:[12,0,15,0,19,0,15,0,12,0,14,0,17,0,14,0],lt:'triangle',lv:.07,kick:1,hat:0}
  };
  function stopMusic(){if(mus){clearInterval(mus.iv);mus=null}}
  function music(name,alive){
    stopMusic();const T=TRACKS[name];if(!T)return;
    mus={name,step:0,next:0,iv:0};
    const m=mus,sd=60/T.bpm/4;
    m.iv=setInterval(()=>{
      if((alive&&!alive())||mus!==m){if(mus===m)stopMusic();return}
      const c=ctx();if(!c||mu)return;if(!m.next)m.next=c.currentTime+.05;
      while(m.next<c.currentTime+.18){
        const i=m.step,t=m.next-c.currentTime,bar=Math.floor(i/16),bn=T.bass[bar%T.bass.length];
        if(i%4===0)tone(mtof(T.root+bn-12),sd*3.6,'triangle',.11,0,t);
        const ln=T.lead[i%16];if(ln)tone(mtof(T.root+bn+ln),sd*1.7,T.lt,T.lv,0,t);

      }
    },40);

      if(!b.hid){const al=b.al==null?1:b.al;if(S.stage===0)drawOrbBoss(b,col,al);else if(S.stage===1)drawCube(b,col,al);else if(S.stage===2)drawLiquid(b,col,al,0);else if(S.stage===4)drawEyeBoss(b,col,al);else if(S.stage===5)drawTallGem(b,col,al);else if(S.stage===6)drawThanos(b,al);else drawBoss(b,col,al,false)}
      b.f=Math.max(0,b.f-.016);
      if(b.cast&&!b.hid){ctx.save();ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=10;ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText(CAST[b.cast.k],b.x,b.y-b.r-(S.stage===6?64:14));ctx.restore()}
      ctx.fillStyle='#1a1733';ctx.fillRect(100,14,W-200,10);ctx.fillStyle=col;ctx.fillRect(100,14,(W-200)*Math.max(0,b.hp/b.max),10);
      ctx.fillStyle='#ebe8ff';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText(SG(S.stage).b,W/2,40);if(b.sh>0){ctx.fillStyle='#8fe8ff';ctx.fillRect(100,27,(W-200)*Math.max(0,b.sh/(b.max*.1)),4)}}
    if(S.drop){const d=S.drop;drawGem(ctx,d.x,d.y+Math.sin(T*3)*6,24,d.g.c,T,true)}
    S.pb.forEach(b=>{ctx.shadowColor=b.c;ctx.shadowBlur=b.sp?18:10;ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.fill();
      if(b.sp){ctx.fillStyle='#8a3dff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*.6,0,7);ctx.fill();ctx.shadowColor='#c9a6ff';ctx.shadowBlur=12;ctx.lineJoin='round';
        for(let j=0;j<4;j++){let a=Math.random()*6.283,x=b.x+Math.cos(a)*b.r*.7,y=b.y+Math.sin(a)*b.r*.7;ctx.strokeStyle=j%2?'#ffffff':'#c9a6ff';ctx.lineWidth=j%2?1.2:2;ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<4;i++){a+=(Math.random()-.5)*1.6;x+=Math.cos(a)*(6+Math.random()*7);y+=Math.sin(a)*(6+Math.random()*7);ctx.lineTo(x,y)}ctx.stroke()}}});ctx.shadowBlur=0;
    S.eb.forEach(b=>{const r=b.r||5;ctx.shadowColor=b.c;ctx.shadowBlur=8;
      if(b.hold>0){ctx.strokeStyle=b.c;ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.stroke();return}
      ctx.fillStyle=b.c;ctx.beginPath();ctx.arc(b.x,b.y,r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(b.x,b.y,r*.4,0,7);ctx.fill()});ctx.shadowBlur=0;
    S.lines.forEach(l=>{ctx.strokeStyle=G[5].c;ctx.shadowColor=G[5].c;ctx.shadowBlur=12;ctx.lineWidth=2.5;ctx.beginPath();l.pts.forEach((q,i)=>{const x=q[0]+(i?(Math.random()-.5)*6:0),y=q[1]+(i?(Math.random()-.5)*6:0);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()});ctx.shadowBlur=0;
    S.pa.forEach(q=>{ctx.globalAlpha=Math.max(0,q.l/q.m);if(q.ring){ctx.strokeStyle=q.c;ctx.lineWidth=3;ctx.beginPath();ctx.arc(q.x,q.y,q.ring*(1-q.l/q.m),0,7);ctx.stroke()}else{ctx.fillStyle=q.c;ctx.fillRect(q.x-2,q.y-2,4,4)}});ctx.globalAlpha=1;
    const p=S.p;
    if(S.st!=='lose'&&!(p.inv>0&&Math.floor(T*14)%2)){
      S.got.forEach((id,i)=>{const a=T*2+i*6.283/S.got.length;drawGem(ctx,p.x+Math.cos(a)*30,p.y+Math.sin(a)*30,6,G.find(x=>x.id===id).c,T,false)});
      const wc=S.wp==='base'?'#ffd27a':G.find(x=>x.id===S.wp).c;
      drawPlane(ctx,p.x,p.y,p.a+1.5708,wc,Math.hypot(p.vx,p.vy)>60);
      if(S.wp==='power'&&S.chgF&&S.st==='play'){const k=1-Math.max(0,S.fcd)/CHG,ox=p.x+Math.cos(p.a)*34,oy=p.y+Math.sin(p.a)*34;ctx.save();ctx.shadowColor='#8a3dff';ctx.shadowBlur=18+20*k;ctx.strokeStyle='#3a0f7a';ctx.lineWidth=7+3*k;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x+Math.cos(p.a)*14,p.y+Math.sin(p.a)*14);ctx.lineTo(ox,oy);ctx.stroke();ctx.fillStyle=G[0].c;ctx.beginPath();ctx.arc(ox,oy,3+14*k,0,7);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#c9a6ff';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ox,oy,5+14*k,0,7);ctx.stroke();ctx.shadowColor='#c9a6ff';ctx.shadowBlur=10;for(let j=0;j<2+Math.floor(k*4);j++){let a=Math.random()*6.283,x=ox+Math.cos(a)*(4+12*k),y=oy+Math.sin(a)*(4+12*k);ctx.strokeStyle=j%2?'#fff':'#c9a6ff';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(x,y);for(let i=0;i<3;i++){a+=(Math.random()-.5)*1.8;x+=Math.cos(a)*(5+8*k);y+=Math.sin(a)*(5+8*k);ctx.lineTo(x,y)}ctx.stroke()}ctx.restore()}
    }
    if(p.frz>0){ctx.save();ctx.strokeStyle=G[5].c;ctx.shadowColor=G[5].c;ctx.shadowBlur=16;ctx.lineWidth=2.5;ctx.globalAlpha=.9;
      ctx.beginPath();for(let i=0;i<6;i++){const a=i*1.0472+.52,x=p.x+Math.cos(a)*30,y=p.y+Math.sin(a)*30;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();ctx.stroke();
      ctx.beginPath();ctx.arc(p.x,p.y,38,-1.5708,-1.5708+6.283*Math.max(0,p.frz));ctx.stroke();
      ctx.globalAlpha=1;ctx.fillStyle='#fff7c2';ctx.font='bold 28px sans-serif';ctx.textAlign='center';ctx.fillText('定身',p.x,Math.max(36,p.y-50));ctx.restore()}
    S.dn.forEach(d=>{ctx.globalAlpha=Math.min(1,d.t*2);ctx.fillStyle=d.c;ctx.shadowColor='#000';ctx.shadowBlur=4;ctx.font='bold 17px sans-serif';ctx.textAlign='center';ctx.fillText(d.s,d.x,d.y)});ctx.globalAlpha=1;ctx.shadowBlur=0;
    if(S.bn){const a=Math.min(1,S.bn.t,(2.4-S.bn.t)*3);ctx.globalAlpha=Math.max(0,a);ctx.fillStyle='#fff';ctx.shadowColor=col;ctx.shadowBlur=20;ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillText(S.bn.s,W/2,H/2-40);ctx.globalAlpha=1;ctx.shadowBlur=0}
    if(S.flash>0){ctx.fillStyle='rgba(255,255,255,'+Math.min(.6,S.flash*1.8)+')';ctx.fillRect(0,0,W,H)}
    if(S.st==='snap'){ctx.fillStyle='rgba(255,255,255,'+Math.max(0,Math.min(1,S.snap<1.4?S.snap/1.4:(2.2-S.snap)/.8))+')';ctx.fillRect(0,0,W,H)}
    if(S.rw){ /* 倒轉中：綠色濾鏡、掃描線、倒轉箭頭 */
      ctx.fillStyle='rgba(47,224,122,.16)';ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(0,0,0,.18)';for(let y=(T*80)%6;y<H;y+=6)ctx.fillRect(0,y,W,2);
      ctx.fillStyle='#bfffd8';ctx.shadowColor='#2fe07a';ctx.shadowBlur=16;ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText('◀◀ 時間倒轉',W/2,H/2-40);ctx.shadowBlur=0}
    ctx.restore();
    const op=(S.st==='play'&&p.frz>0)?'.75':'1';if(op!==curOp){curOp=op;cv.style.opacity=op}
    const hp=Math.max(0,Math.round(p.hp));
    if(hp!==lastHp){lastHp=hp;const pc=hp/MAXHP;hpf.style.width=pc*100+'%';hpg.style.width=pc*100+'%';
      hpf.style.background=pc>.5?'linear-gradient(90deg,#2fe07a,#9be84a)':pc>.25?'linear-gradient(90deg,#ffb020,#ffd52e)':'linear-gradient(90deg,#ff3b3b,#ff7a5a)';hpt.textContent=hp+' / '+MAXHP}
    $('sc').textContent='得分 '+S.score;
    $('sg').textContent=S.st==='menu'?'—':S.stage<6?`第 ${S.stage+1} 關・${G[S.stage].n}寶石`:(S.st==='play'?'最終關・薩諾斯':'終章');
    G.forEach(g=>{const s=slots[g.id],on=S.got.includes(g.id),c=s.c;c.clearRect(0,0,88,88);
      if(on)drawGem(c,44,44,30,g.c,T,true);else{c.globalAlpha=.28;drawGem(c,44,44,30,'#8a8a99',0,false);c.globalAlpha=1}
      s.el.classList.toggle('on',S.wp===g.id)});
  }
  let last=performance.now(),raf=0,dead=false;
  function loop(n){if(dead)return;raf=requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;T+=dt;if(S.st==='play'||S.st==='snap')update(dt);draw()}
  const kd=e=>{const k=e.key.toLowerCase();keys[k]=true;if(k>='1'&&k<='6')pick(G[+k-1].id);if(k==='m'){audioInit();setMute(!muted)}if(k.startsWith('arrow'))e.preventDefault()};
  const ku=e=>keys[e.key.toLowerCase()]=false;
  addEventListener('keydown',kd);addEventListener('keyup',ku);
  function pp(e){const r=cv.getBoundingClientRect();ptr.x=(e.clientX-r.left)*W/r.width;ptr.y=(e.clientY-r.top)*H/r.height}
  cv.addEventListener('pointerdown',e=>{ptr.on=true;pp(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}});
  cv.addEventListener('pointermove',e=>{if(ptr.on)pp(e)});
  ['pointerup','pointercancel'].forEach(t=>cv.addEventListener(t,()=>ptr.on=false));
  window.__stop=()=>{dead=true;cancelAnimationFrame(raf);removeEventListener('keydown',kd);removeEventListener('keyup',ku);try{AC&&AC.close()}catch(e){}};
  window.__sh=()=>S;
  reset('menu');
  showOv('無限寶石：寶石機鬥','駕駛你的戰機闖過七關：前六關各有一位寶石守衛，擊敗後取得寶石並解鎖專屬武器；集齊六顆之後，最終關要面對瘋狂泰坦・薩諾斯。<br>移動：WASD／方向鍵／按住拖曳；機頭會自動轉向最近的目標並從正前方開火。血量 1000，不同攻擊扣的血不同，每位守衛都有自己的彈幕和特殊技。','開始出擊');
  raf=requestAnimationFrame(loop);
}

/* ===== 路由 ===== */
function route(){live=[];
  if(window.__stop){window.__stop();window.__stop=null}
  const [p,arg]=cur.split('/'),a=$('app');a.textContent='';a.className=(!p||p==='home'||!({games:1,board:1,game:1})[p])?'home':'';
  a.dataset.pg=a.className==='home'?'home':p;a.dataset.g=arg||'';paintNav(p==='game'?'games':p);
  ({home:pageHome,games:pageGames,board:pageBoard,game:pageGame}[p]||pageHome)(a,arg);
  try{scrollTo(0,0)}catch(e){}
}
addEventListener('hashchange',()=>{const n=location.hash.slice(1)||'home';if(n!==cur){cur=n;route()}});
$('logo').onclick=e=>{e.preventDefault();go('home')};
requestAnimationFrame(frame);paintWho();route();initServices();
</script>
